name: BHOOMI Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop, backend, 'release/**' ]
  pull_request:
    branches: [ main, master, develop, backend, 'release/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Bhoomi API (FastAPI) Quality Gate
  # ============================================================================
  api-validation:
    name: Bhoomi API (Migrate & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # pgvector/pgvector ships pgvector pre-installed on top of Postgres 16,
    # matching infra/docker-compose.yml's local dev database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhoomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bhoomi
      JWT_SECRET_KEY: ci-test-secret-key
      PROBLEM_STATEMENT: sih25076
      DIAGNOSIS_MODEL: stub
      EMBEDDING_PROVIDER: stub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install Dependencies
        run: pip install -q -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d bhoomi -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic Migrations
        run: python -m alembic upgrade head

      - name: Ingest Knowledge Corpus
        run: python -m app.services.rag.ingest

      - name: Seed Demo Fixtures
        run: python -m scripts.seed_full_demo --stage full

      - name: Run Test Suite
        run: python -m pytest -q --ignore=tests/e2e

      - name: Run E2E Demo Runbook (best-effort)
        # Tracked separately from the main gate: the runbook asserts exact
        # score values end-to-end and is more sensitive to in-flight scoring
        # changes than the unit/integration suite above. Surfaced here for
        # visibility without blocking the pipeline on it.
        continue-on-error: true
        run: python -m pytest -q tests/e2e

  # ============================================================================
  # 2. Bhoomi ML Inference Service Quality Gate
  # ============================================================================
  ml-service-validation:
    name: Bhoomi ML Service (Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ml/requirements.txt

      - name: Install Dependencies
        run: pip install -q -r requirements.txt

      - name: Run Test Suite
        run: python -m pytest -q
